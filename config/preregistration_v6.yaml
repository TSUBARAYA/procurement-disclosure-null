# ============================================================
# NEO v6.0 预注册（冻结于任何 v6.0 结果计算之前）
# 版本 v6.0.0 | 日期 2026-10-19
# ============================================================

meta:
  version: v6.0.0
  date: 2026-10-19
  supersedes: null            # 不取代 v1-v5；并行保留
  status: frozen              # 本文件写入后不得修改；修改须开 v6.1 并记录动机

# ---------- 1. 动机（v1-v5 失败诊断的推论） ----------
motivation:
  v1_failure: 事前趋势违反（改革采纳内生于治理水平）
  v2_failure: 识别修复后功效不足；安慰剂暴露结构性偏差（MDE=0.130）
  v3_result: 第一阶段强（电子投标+0.38~0.43）；竞争结局无改善
  v4_result: 合同级微观+长窗口：竞争仍不显著；SME参与显著扩大（+0.334）
  v5_result: 低基线国家（ProZorro）数据获取受限，uncertain，未完成
  core_diagnosis: >
    四轮实验共同指向：识别变异是国家级的（28 国、3 个 never-treated 对照），
    国家层面可处理的变异太少，MDE 远高于理论预期效应量。v6.0 换识别来源：
    不再依赖"国家何时改革"的处理变异，改用 EU 法律硬断点——采购阈值。
    阈值上方合同必须走 EU 全范围公开程序（TED 公告、电子提交、更长公告期），
    下方只需国内程序。识别来自法律的断点，N 来自合同（百万级），
    MDE 问题从设计上消解。

# ---------- 2. 假设（可证伪） ----------
hypotheses:
  H1_v6: 阈值断点处，更严格的 EU 公开程序（电子披露）与更高的竞争相关
         ——若"电子披露改善竞争"，单投标合同占比应在阈值上方显著下降
         （断点跳跃 τ < 0 且 CI 排除 0）。
  H1_null_v6: 无断点跳跃（CI 跨零）——电子披露程序本身不改变竞争。
  H2_v6: 断点效应在改革后年份（2016+）强于改革前年份（交互）——
         若数字化改革放大了披露程序的效应。

# ---------- 3. 阈值表（断点位置，官方来源） ----------
thresholds:
  source: >
    Directive 2014/24/EU Art.4 原文；Commission Delegated Regulation
    (EU) 2017/2365（2018-19）；2019/1828（2020-21）；2021/2170（2022-23）；
    2013 用 Directive 2004/18/EC。
  values:  # [sub-central 货物/服务, 工程] EUR excl. VAT
    2013: [207000, 5235000]
    2014: [207000, 5235000]
    2015: [207000, 5235000]
    2016: [207000, 5235000]
    2017: [207000, 5235000]
    2018: [221000, 5548000]
    2019: [221000, 5548000]
    2020: [214000, 5350000]
    2021: [214000, 5350000]
    2022: [215000, 5382000]
    2023: [215000, 5382000]

# ---------- 4. 样本与估计量 ----------
design:
  data: 本地 TED CAN 2013-2023（data/external/ted/），不重新下载
  sample: EU-28 授予国、未取消、合同类型 W/S/U
  running_variable: r = log(合同金额) − log(当年该类型 EU 阈值)
  treatment: above = 1{合同金额 ≥ 当年该类型 EU 阈值}
  main_bandwidth: ±20%（log 尺度）
  sensitivity_bandwidths: [±10%, ±15%, ±20%, ±25%]
  polynomial: [1, 2]
  outcomes:
    - single: 单投标合同指示（n_offers == 1）
    - log_offers: log(1 + n_offers)
    - elec_share: 电子投标数 / 总投标数
    - foreign_win: 中标方为外国指示
  controls: [log_value]
  fixed_effects: [country×year, type]
  standard_errors: 聚类到国家（28 个，保守）
  estimator: 局部多项式 RD（Y ~ above + poly(r) + above×poly(r) + controls + FE）

# ---------- 5. 诊断（全部报告，无论有利不利） ----------
diagnostics:
  density: McCrary 式断点两侧密度检验（操纵/选择证据）
  placebo_cutoffs: [0.7, 0.8, 1.2, 1.3] × 真实阈值（应无跳跃）
  selection: 阈值下方样本的 OUT_OF_DIRECTIVES=1 占比（自愿公告程度）；
             阈值下方合同进入 TED 是自选择的，结论限定于 TED 可见样本
  covariate: log_value 对 above（running 已控制，机械连续性检查）

# ---------- 6. 判定规则 ----------
decision_rule:
  pass: τ CI 排除 0 且方向符合理论（single/log_offers 为负）
  fail_direction: τ CI 排除 0 且方向相反
  null: CI 跨零
  uncertain: 密度检验显著（断点处操纵）→ 主估计不可信，全部结论降级
  placebo_alarm: 任一安慰剂断点显著 → 标记估计量威胁

# ---------- 7. 已知威胁（事前声明） ----------
threats_declared:
  - 阈值下方合同是"自愿公告"的自选择样本（OUT_OF_DIRECTIVES），
    与阈值上方非随机可比；用 OOD 分布量化，结论限定于 TED 可见样本
  - 合同金额可能被买方操纵在阈值下方（拆单/低报）——密度检验直接检验
  - 断点识别的是"披露程序严格度的边际效应"，不等于"数字化改革的总效应"
    （后者已被 v1-v5 多轮检验）；本设计是机制检验，不是总效应再检验

# ---------- 8. 禁止事项 ----------
prohibited:
  - 不得在见到结果后调整阈值表或带宽主口径
  - 不得因密度检验不利而隐瞒，须降级全部结论
  - 不得把"TED 可见样本内"的结论外推为全体采购市场
